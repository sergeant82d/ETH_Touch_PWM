; ETH_Touch_PWM - PlatformIO build of the Arduino IDE sketch
; ESP32_S3_FanController_2inch (repo ESP32S3-Ethernet-Fan-Controller, commit c23de85).
; Board: Waveshare ESP32-S3-Touch-LCD-2 + external W5500.
; Second build for the Waveshare ESP32-S3-ETH (fan_controller_01), see the end of this file.

[platformio]
; Only the Touch-LCD-2 build by default, so a plain "pio run -t upload" never flashes the
; wrong board. ESP32-S3-ETH: pio run -e waveshare_s3_eth [-t upload]
default_envs = waveshare_s3_lcd2

[env:waveshare_s3_lcd2]
; pioarduino 55.03.311 = Arduino-ESP32 core 3.3.11, the same core the Arduino IDE build uses.
; (The stock "espressif32" platform only ships core 2.x.)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Flash / partitions: from the sketch itself (main.cpp: app3M_fat9M_16MB, data partition "ffat").
board_upload.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv

; From the Arduino IDE Tools menu: PSRAM "OPI PSRAM", USB CDC On Boot "Enabled".
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The core's ETH.h includes "Network.h" in quotes; the library finder doesn't give the
    ; Ethernet library that folder, so add it for everything.
    -I${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/libraries/Network/src

monitor_speed = 115200

; Web page compiled into the firmware (src/web_server.cpp serves it); flashing updates it.
board_build.embed_txtfiles = web/index.html

; Versions match Documents\Arduino\libraries used by the working Arduino IDE build.
; SD, LittleFS, FS, SPI, Wire come with the ESP32 core.
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@7.4.3
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    paulstoffregen/Time@1.6.1
    ; MQTT for Home Assistant (added 2026-09-27, not in the Arduino IDE build)
    knolleary/PubSubClient@2.8
    ; Use the ESP32 core's own SD library, as the Arduino IDE does. Without this, PlatformIO
    ; installs the generic Arduino SD 1.3.0 (an ST7789-library dependency) and prefers it.
    SD=symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD
    ; W5500 through the core's ETH driver (replaced arduino-libraries/Ethernet 2026-09-27),
    ; named so the core's libraries are used and Network is compiled in.
    Ethernet=symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/Ethernet
    Network=symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network

; Waveshare ESP32-S3-ETH: onboard W5500, SD slot, no LCD/touch (pins.h, BOARD_S3_ETH).
; Same core, 16 MB flash, OPI PSRAM and partitions as above - ASSUMED for this board
; (ESP32-S3R8, N16R8 module); check with esptool before the first flash.
[env:waveshare_s3_eth]
extends = env:waveshare_s3_lcd2
build_flags =
    ${env:waveshare_s3_lcd2.build_flags}
    -DBOARD_S3_ETH
build_src_filter = +<*> -<display.cpp> -<touch.cpp>
